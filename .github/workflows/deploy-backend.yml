name: Deploy Backend to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test & Verify Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x backend/gradlew

      - name: Run Tests
        run: |
          cd backend
          ./gradlew test --no-daemon

  deploy:
    name: Trigger Render Deployment
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not configured in GitHub Secrets. Skipping automatic webhook deploy."
            echo "If your Render web service is connected directly to your GitHub repository, Render will auto-deploy on git push."
            exit 0
          fi
          echo "Triggering Render deployment..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully triggered Render deployment (HTTP $HTTP_STATUS)!"
            echo "$BODY"
          else
            echo "::error::Render deploy hook failed with status $HTTP_STATUS: $BODY"
            exit 1
          fi

      - name: Verify Backend Health (Optional)
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "RENDER_BACKEND_URL secret not set; skipping live health check."
            exit 0
          fi
          echo "Waiting 60 seconds for Render container startup..."
          sleep 60
          HEALTH_URL="${BACKEND_URL%/}/api/health"
          echo "Checking $HEALTH_URL..."
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Backend health check passed with status 200 OK!"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 15s..."
            sleep 15
          done
          echo "::warning::Health check did not respond with 200 in the allotted time. Check Render logs."

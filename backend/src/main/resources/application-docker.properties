# Production / Docker PostgreSQL Database Configuration (Supports Neon DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/academydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:academyuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:academy123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings for Serverless PostgreSQL (Neon DB & Low Memory)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:240000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:30000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}

# Embedded Tomcat Thread Tuning for 512MB RAM Container
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.port=${PORT:${SERVER_PORT:8081}}

# Production JPA Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Production logging
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# SMTP Email Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Email Settings
app.email.from=${SMTP_FROM_EMAIL:${SMTP_USERNAME:noreply@academy.com}}
app.email.from-name=${SMTP_FROM_NAME:Academy Platform}

# Email Validation Settings
app.email.validation.dns-timeout=5000
app.email.validation.smtp-timeout=10000
app.email.validation.smtp-read-timeout=5000
app.email.validation.strict-mode=${EMAIL_STRICT_MODE:true}

# Security settings
server.error.include-message=never
server.error.include-binding-errors=never

# File Upload Configuration
app.upload.dir=${UPLOAD_DIR:/app/data/uploads}
app.profile.photos.dir=${UPLOAD_DIR:/app/data/uploads}/profiles
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

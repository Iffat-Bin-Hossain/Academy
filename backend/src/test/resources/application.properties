# Test Configuration with In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable real SMTP in tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@academy.com
spring.mail.password=test-password
app.email.from=test@academy.com
app.email.from-name=Academy Test
app.email.validation.strict-mode=false

# JWT Configuration for testing
app.jwt.secret=testing_jwt_secret_key_that_is_at_least_256_bits_long_1234567890
app.jwt.expiration=3600000

# File upload directory for testing
app.upload.dir=./build/test-uploads
app.profile.photos.dir=./build/test-uploads/profiles

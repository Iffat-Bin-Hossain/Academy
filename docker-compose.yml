services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: academy_db
    environment:
      POSTGRES_DB: academydb
      POSTGRES_USER: academyuser
      POSTGRES_PASSWORD: academy123
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - academy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academyuser -d academydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: academy_backend
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=240000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=30000
      - PORT=8081
      - SERVER_PORT=8081
      - UPLOAD_DIR=/app/data/uploads
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Academy Platform}
      - EMAIL_STRICT_MODE=${EMAIL_STRICT_MODE:-true}
    ports:
      - "8081:8081"
    volumes:
      - academy_uploads:/app/data/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - academy_network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: academy_frontend
    environment:
      - REACT_APP_BACKEND_URL=http://backend:8081
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - academy_network
    restart: unless-stopped

volumes:
  postgres_data:
  academy_uploads:

networks:
  academy_network:
    driver: bridge